<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapor Pemasangan Banner — Aqiqah Nurul Hayat Tuban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon-aqq.png" />
<style>
  .vendor-wrap { max-width: 460px; margin: 0 auto; padding: 28px 20px 60px; }
  .intro { text-align: center; margin-bottom: 22px; }
  .intro h1 { font-size: 21px; margin: 0 0 6px; }
  .intro p { font-size: 15px; margin: 0; }

  .capture-zone {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    border: 2px dashed var(--brown-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .capture-zone.has-photo { border-style: solid; border-color: var(--gold); }
  .capture-zone img { width: 100%; height: 100%; object-fit: cover; }
  .capture-placeholder { text-align: center; color: var(--brown-500); padding: 20px; }
  .capture-placeholder svg { width: 52px; height: 52px; margin-bottom: 8px; }
  .capture-placeholder p { margin: 0; font-weight: 700; font-size: 16px; color: var(--brown-700); }
  .capture-placeholder span { font-size: 13px; color: var(--text-muted); }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
    min-height: 20px;
    text-align: center;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brown-200); flex-shrink: 0; }
  .status-dot.ready { background: var(--success); }
  .status-dot.warn { background: var(--gold-dark); }
  .status-dot.pulsing { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .location-detail {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--brown-200);
    border-radius: 12px;
    padding: 8px 12px;
    margin: -12px 0 18px;
    line-height: 1.45;
  }
  .location-detail strong { color: var(--brown-700); }

  .retry-row { text-align: center; margin-bottom: 20px; }
  .retry-row .btn { padding: 9px 20px; font-size: 14px; }

  .gallery-row { text-align: center; margin-bottom: 18px; }

  .submit-row .btn { width: 100%; }

  .success-screen { text-align: center; padding: 48px 20px; }
  .success-check {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--success-bg); color: var(--success);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .success-check svg { width: 34px; height: 34px; }
  .success-meta { color: var(--text-muted); font-size: 14px; margin: 4px 0 28px; }

  input[type="file"] { display: none; }
</style>
</head>
<body>
  <header class="topbar">
    <img src="logo_aqiqah.png" alt="Aqiqah Nurul Hayat" class="logo">
    <h4>Cabang Tuban</h4>
    <a href="login.html" class="menu-btn" aria-label="Masuk sebagai admin">
      <span></span><span></span><span></span>
    </a>
  </header>

  <main class="vendor-wrap">
    <div id="formView">
      <div class="intro">
        <h1>Lapor pemasangan banner</h1>
        <p class="serif-accent">Foto banner yang terpasang, lalu kirim</p>
      </div>

      <div class="capture-zone" id="captureZone" role="button" tabindex="0" aria-label="Ambil foto banner">
        <div class="capture-placeholder" id="capturePlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
          <p>Ambil foto banner</p>
          <span>Ketuk untuk buka kamera</span>
        </div>
        <img id="previewImg" alt="" style="display:none;">
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <input type="file" id="galleryInput" accept="image/*">

      <div class="status-row">
        <span class="status-dot pulsing" id="statusDot"></span>
        <span id="statusText">Mengambil lokasi…</span>
      </div>
      <div class="location-detail" id="locationDetail" style="display:none;"></div>

      <div class="retry-row" id="retryLocationRow" style="display:none;">
        <button class="btn btn-outline" id="retryLocationBtn" type="button">Coba ambil lokasi lagi</button>
      </div>

      <div class="gallery-row">
        <button type="button" class="btn-text" id="galleryBtn">Atau upload foto dari galeri</button>
      </div>      
      
      <div class="submit-row">
        <button class="btn btn-primary" id="submitBtn" disabled>Kirim laporan</button>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display:none; margin-top:16px;"></div>
    </div>

    <div id="successView" class="success-screen" style="display:none;">
      <div class="success-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12l5 5L20 6"/></svg>
      </div>
      <h1 style="font-size:20px; margin:0 0 4px;">Laporan terkirim</h1>
      <p class="success-meta" id="successMeta"></p>
      <button class="btn btn-primary" id="resetBtn">Kirim laporan lain</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="config.js"></script>
  <script>
    let photoDataUrl = null;
    let coords = null;
    let capturedAt = null;
    let retryAction = requestLocation;

    const captureZone = document.getElementById('captureZone');
    const capturePlaceholder = document.getElementById('capturePlaceholder');
    const previewImg = document.getElementById('previewImg');
    const fileInput = document.getElementById('fileInput');
    const galleryInput = document.getElementById('galleryInput');
    const galleryBtn = document.getElementById('galleryBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const locationDetail = document.getElementById('locationDetail');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const successMeta = document.getElementById('successMeta');
    const resetBtn = document.getElementById('resetBtn');
    const retryLocationRow = document.getElementById('retryLocationRow');
    const retryLocationBtn = document.getElementById('retryLocationBtn');

    captureZone.addEventListener('click', () => fileInput.click());
    captureZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
    galleryBtn.addEventListener('click', () => galleryInput.click());

    async function showLocationDetail(lat, lng) {
      locationDetail.style.display = 'block';
      locationDetail.innerHTML = `
        <div><strong>Koordinat:</strong> ${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}</div>
        <div id="addressLine"><strong>Alamat:</strong> Memuat alamat…</div>
      `;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=id`);
        const data = await res.json();
        const addressLine = document.getElementById('addressLine');
        if (!addressLine) return;

        if (data && data.display_name) {
          const alamatSingkat = data.display_name.replace(/,\s*Indonesia$/i, '');
          addressLine.innerHTML = `<strong>Alamat:</strong> ${alamatSingkat}`;
        } else {
          addressLine.innerHTML = `<strong>Alamat:</strong> Alamat tidak ditemukan`;
        }
      } catch (e) {
        const addressLine = document.getElementById('addressLine');
        if (addressLine) {
          addressLine.innerHTML = `<strong>Alamat:</strong> Gagal memuat alamat`;
        }
      }
    }

    function hideLocationDetail() {
      locationDetail.style.display = 'none';
      locationDetail.innerHTML = '';
    }

    async function applySelectedPhoto(file) {
      photoDataUrl = await compressImage(file);
      previewImg.src = photoDataUrl;
      previewImg.style.display = 'block';
      capturePlaceholder.style.display = 'none';
      captureZone.classList.add('has-photo');
      updateSubmitState();
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      capturedAt = null;
      await applySelectedPhoto(file);
      requestLocation();
    });

    galleryInput.addEventListener('change', async () => {
      const file = galleryInput.files[0];
      if (!file) return;
      await applySelectedPhoto(file);
      await extractLocationFromExif(file);
    });

    function compressImage(file, maxWidth = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function requestLocation() {
      coords = null;
      hideLocationDetail();
      updateSubmitState();
      retryLocationRow.style.display = 'none';
      statusDot.className = 'status-dot pulsing';
      statusText.textContent = 'Mengambil lokasi…';

      if (!navigator.geolocation) {
        statusDot.classList.remove('pulsing');
        statusDot.classList.add('warn');
        statusText.textContent = 'Perangkat tidak mendukung lokasi otomatis — laporan tidak bisa dikirim';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          statusDot.classList.remove('pulsing');
          statusDot.classList.add('ready');
          statusText.textContent = 'Lokasi ditemukan';
          showLocationDetail(coords.lat, coords.lng);
          updateSubmitState();
        },
        () => {
          statusDot.classList.remove('pulsing');
          statusDot.classList.add('warn');
          statusText.textContent = 'Lokasi tidak ditemukan — laporan tidak bisa dikirim tanpa lokasi';
          retryAction = requestLocation;
          retryLocationBtn.textContent = 'Coba ambil lokasi lagi';
          retryLocationRow.style.display = 'block';
          updateSubmitState();
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    async function extractLocationFromExif(file) {
      coords = null;
      capturedAt = null;
      hideLocationDetail();
      retryLocationRow.style.display = 'none';
      statusDot.className = 'status-dot pulsing';
      statusText.textContent = 'Membaca lokasi dari foto…';
      updateSubmitState();

      if (typeof exifr === 'undefined') {
        statusDot.classList.remove('pulsing');
        statusDot.classList.add('warn');
        statusText.textContent = 'Gagal memuat pembaca lokasi foto — gunakan "Ambil foto banner" sebagai gantinya';
        updateSubmitState();
        return;
      }

      let gpsFound = false;
      try {
        const gps = await exifr.gps(file);
        if (gps && Number.isFinite(gps.latitude) && Number.isFinite(gps.longitude)) {
          coords = { lat: gps.latitude, lng: gps.longitude };
          gpsFound = true;
        }
      } catch (e) { /* lanjut ke OCR jika metadata GPS tidak tersedia */ }

      let locationSource = 'EXIF';
      let ocrResult = null;
      statusDot.className = 'status-dot pulsing';
      statusText.textContent = 'Membaca tulisan foto… menyiapkan OCR';
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 30)));

      try {
        ocrResult = await extractPhotoText(file);
        if (!gpsFound && ocrResult && ocrResult.coords) {
          coords = ocrResult.coords;
          gpsFound = true;
          locationSource = 'teks koordinat pada foto (OCR)';
        }
        if (!capturedAt && ocrResult && ocrResult.capturedAt) {
          capturedAt = ocrResult.capturedAt;
        }
      } catch (e) {
        console.warn('OCR foto gagal:', e);
        const ocrErrorMessage = (e && e.message && e.message.includes('Pustaka OCR'))
          ? 'OCR tidak termuat. Periksa koneksi internet/CDN lalu muat ulang halaman.'
          : `OCR gagal dijalankan: ${(e && e.message) ? e.message : 'kesalahan tidak diketahui'}`;
        statusText.textContent = ocrErrorMessage;
      }

      if (gpsFound) {
        statusDot.classList.remove('pulsing');
        statusDot.classList.add('ready');
        statusText.textContent = locationSource === 'EXIF'
          ? 'Lokasi dari metadata foto ditemukan'
          : 'Koordinat terbaca dari tulisan foto (OCR)';
        showLocationDetail(coords.lat, coords.lng);
      } else {
        statusDot.classList.remove('pulsing');
        statusDot.classList.add('warn');
        if (!statusText.textContent.startsWith('OCR gagal') && !statusText.textContent.startsWith('OCR tidak termuat')) {
          statusText.textContent = 'OCR selesai, tetapi koordinat belum terbaca. Pastikan tulisan GPS terlihat jelas, lalu coba lagi.';
        }
        retryAction = () => galleryInput.click();
        retryLocationBtn.textContent = 'Pilih foto lain dari galeri';
        retryLocationRow.style.display = 'block';
      }

      try {
        const exifData = await exifr.parse(file, ['DateTimeOriginal']);
        if (exifData && exifData.DateTimeOriginal instanceof Date) capturedAt = exifData.DateTimeOriginal;
      } catch (e) { /* tanggal akan dicoba dari OCR jika belum tersedia */ }

      updateSubmitState();
    }

    async function extractPhotoText(file) {
      if (typeof Tesseract === 'undefined') {
        throw new Error('Pustaka OCR tidak termuat. Periksa koneksi internet/CDN.');
      }

      let imageUrl = photoDataUrl;
      if (!imageUrl) {
        imageUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('File foto tidak dapat dibaca. Coba pilih foto dari penyimpanan internal.'));
          reader.readAsDataURL(file);
        });
      }
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Gambar tidak dapat dibuka untuk OCR.'));
        img.src = imageUrl;
      });

      // Prioritaskan area KIRI BAWAH tempat informasi Work Report & Koordinat berada
      const cropSpecs = [
        { x: 0, y: 0.60, w: 0.72, h: 0.40, label: 'kiri bawah' },
        { x: 0, y: 0.50, w: 0.85, h: 0.50, label: 'kiri bawah lebih luas' },
        { x: 0, y: 0.55, w: 1, h: 0.45, label: 'seluruh bagian bawah' },
        //{ x: 0, y: 0, w: 1, h: 1, label: 'seluruh foto' }
      ];
      const makeCrop = (spec) => {
        const sx = Math.floor(image.width * (spec.x || 0));
        const sy = Math.floor(image.height * spec.y);
        const sw = Math.max(1, Math.floor(image.width * spec.w));
        const sh = Math.max(1, Math.floor(image.height * spec.h));
        const scale = Math.min(1, 1500 / sw);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sw * scale));
        canvas.height = Math.max(1, Math.round(sh * scale));
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Browser tidak dapat menyiapkan gambar untuk OCR.');
        ctx.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        for (let i = 0; i < pixels.length; i += 4) {
          const gray = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
          const enhanced = gray < 95 ? gray * 0.65 : Math.min(255, 95 + (gray - 95) * 1.25);
          pixels[i] = pixels[i + 1] = pixels[i + 2] = enhanced;
        }
        ctx.putImageData(imageData, 0, 0);
        return canvas;
      };

      const parseCoordinates = (rawText) => {
        const text = String(rawText || '').replace(/[−–—]/g, '-').replace(/[Oo]/g, '0').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ');
        const patterns = [
          /(-?\d{1,2})\s*[,\.]\s*(\d{4,})\s*[,;]\s*(\d{2,3})\s*[,\.]\s*(\d{4,})/,
          /(-?\d{1,2})\s*[,\.]\s*(\d{4,})\s+(\d{2,3})\s*[,\.]\s*(\d{4,})/,
          /(-?\d{1,2}[,.]\d{4,})\s*[,; ]+\s*(\d{2,3}[,.]\d{4,})/,
          /lat(?:itude)?\s*[:=]?\s*(-?\d{1,2}[,.]\d{4,}).{0,35}?lon(?:gitude)?\s*[:=]?\s*(\d{2,3}[,.]\d{4,})/i
        ];
        for (const pattern of patterns) {
          const m = text.match(pattern);
          if (!m) continue;
          let lat, lng;
          if (m.length === 5) { lat = Number(`${m[1]}.${m[2]}`); lng = Number(`${m[3]}.${m[4]}`); }
          else { lat = Number(m[1].replace(',', '.')); lng = Number(m[2].replace(',', '.')); }
          if (Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && (lat !== 0 || lng !== 0)) return { lat, lng };
        }
        return null;
      };

      const parsePhotoDateTime = (rawText) => {
        let text = String(rawText || '').replace(/[|]/g, '1').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
        const months = { jan:0, januari:0, feb:1, februari:1, mar:2, maret:2, apr:3, april:3, mei:4, may:4, jun:5, juni:5, jul:6, juli:6, agu:7, ags:7, agustus:7, aug:7, sep:8, sept:8, september:8, okt:9, oktober:9, nov:10, november:10, des:11, desember:11, dec:11 };
        const monthNames = Object.keys(months).join('|');
        const re = new RegExp('\\b(\\d{1,2})\\s+(' + monthNames + ')\\s+(20\\d{2})\\s+(\\d{1,2})[.:](\\d{2})(?:[.:](\\d{2}))?\\b', 'i');
        let m = text.match(re);
        if (m) {
          const day = Number(m[1]), month = months[m[2].toLowerCase()], year = Number(m[3]);
          const hour = Number(m[4]), minute = Number(m[5]), second = Number(m[6] || 0);
          if (day >= 1 && day <= 31 && hour <= 23 && minute <= 59 && second <= 59) {
            const date = new Date(year, month, day, hour, minute, second);
            if (date.getFullYear() === year && date.getMonth() === month && date.getDate() === day) return date;
          }
        }
        m = text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\s+(\d{1,2})[.:](\d{2})(?:[.:](\d{2}))?\b/);
        if (m) {
          const day=+m[1], month=+m[2]-1, year=+m[3], hour=+m[4], minute=+m[5], second=+(m[6]||0);
          if (month>=0 && month<=11 && day>=1 && day<=31 && hour<=23 && minute<=59 && second<=59) {
            const date=new Date(year,month,day,hour,minute,second);
            if(date.getFullYear()===year && date.getMonth()===month && date.getDate()===day) return date;
          }
        }
        return null;
      };

      let foundCoords = null;
      let foundDate = null;
      let lastText = '';
      for (let cropIndex = 0; cropIndex < cropSpecs.length; cropIndex++) {
        const spec = cropSpecs[cropIndex];
        statusText.textContent = `Membaca tulisan foto… ${spec.label} (${cropIndex + 1}/${cropSpecs.length})`;
        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 20)));
        const canvas = makeCrop(spec);
        const result = await Tesseract.recognize(canvas, 'eng', {
          logger: (m) => {
            if (m.status === 'recognizing text' && m.progress) statusText.textContent = `Membaca tulisan foto… ${Math.round(m.progress * 100)}%`;
          },
          tessedit_pageseg_mode: '11',
          preserve_interword_spaces: '1',
          tessedit_char_whitelist: '0123456789.,:/-°mMabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'
        });
        lastText = (result && result.data && result.data.text) || '';
        if (!foundCoords) foundCoords = parseCoordinates(lastText);
        if (!foundDate) foundDate = parsePhotoDateTime(lastText);
        if (foundCoords && foundDate) break;
      }
      console.warn('Hasil OCR foto:', lastText, { coords: foundCoords, capturedAt: foundDate });
      return { coords: foundCoords, capturedAt: foundDate };
    }

    function updateSubmitState() {
      submitBtn.disabled = !(photoDataUrl && coords);
    }

    submitBtn.addEventListener('click', async () => {
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim…';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitReport',
            photoBase64: photoDataUrl,
            latitude: coords ? coords.lat : '',
            longitude: coords ? coords.lng : '',
            capturedAt: capturedAt ? capturedAt.toISOString() : ''
          })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Gagal mengirim laporan');

        successMeta.textContent = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
        formView.style.display = 'none';
        successView.style.display = 'block';
      } catch (err) {
        errorAlert.textContent = 'Gagal mengirim: ' + err.message + '. Periksa koneksi internet lalu coba lagi.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Kirim laporan';
      }
    });

    resetBtn.addEventListener('click', () => {
      photoDataUrl = null;
      coords = null;
      capturedAt = null;
      hideLocationDetail();
      previewImg.style.display = 'none';
      previewImg.src = '';
      capturePlaceholder.style.display = 'block';
      captureZone.classList.remove('has-photo');
      fileInput.value = '';
      galleryInput.value = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Kirim laporan';
      statusDot.className = 'status-dot pulsing';
      statusText.textContent = 'Mengambil lokasi…';
      successView.style.display = 'none';
      formView.style.display = 'block';
      requestLocation();
    });

    retryLocationBtn.addEventListener('click', () => retryAction());

    requestLocation();
  </script>
</body>
</html>
